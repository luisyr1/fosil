# Altavoz en hw:0,1 (WCD), micrófono en hw:0,0.
# El driver fija el reloj I2S para 48 kHz, estéreo y 16 bits: con
# S32_LE suena un 25 % lento y grave, así que dmix va forzado a S16_LE.
pcm.altavoz {
    type dmix
    ipc_key 1024
    slave {
        pcm "hw:0,1"
        format S16_LE
        rate 48000
        channels 2
        period_size 1024
        buffer_size 4096
    }
}
pcm.!default {
    type asym
    playback.pcm { type plug slave.pcm "altavoz" }
    capture.pcm { type plug slave.pcm "hw:0,0" }
}
ctl.!default {
    type hw
    card 0
}
